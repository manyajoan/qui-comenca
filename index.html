<style>
  /* Layout: una sola escena a pantalla completa. El text va fixat a dalt i a baix perquè
     les mans mai el tapin; el centre queda lliure per als dits. */
  :root{
    --ink:#0A1416;
    --ink-lift:#16282C;
    --bone:#EDE7DA;
    --bone-dim:rgba(237,231,218,.58);
    --bone-faint:rgba(237,231,218,.3);
    --dot:clamp(104px, 29vmin, 152px);
    --win:var(--bone);
    --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
    --ui:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    color-scheme: dark;
    height:100%;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html{ height:100%; }
  :root{
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }

  body{
    height:100%;
    margin:0;
    background:
      radial-gradient(135% 90% at 50% 28%, var(--ink-lift) 0%, var(--ink) 56%, #050B0D 100%);
    color:var(--bone);
    font-family:var(--ui);
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }

  .stage{
    position:relative;
    height:100%;
    width:100%;
    overflow:hidden;
    touch-action:none;
    isolation:isolate;
  }
  /* trama de taula de joc */
  .stage::before{
    content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
    background-image: radial-gradient(rgba(237,231,218,.06) 1px, transparent 1.5px);
    background-size: 26px 26px;
    -webkit-mask-image: radial-gradient(125% 85% at 50% 45%, #000 15%, transparent 82%);
    mask-image: radial-gradient(125% 85% at 50% 45%, #000 15%, transparent 82%);
  }

  /* ---------- text ---------- */
  .hud{
    position:absolute; left:0; right:0; z-index:3;
    padding-inline:24px;
    text-align:center;
    pointer-events:none;
  }
  .hud-top{ top:clamp(22px, 8vh, 76px); }
  .hud-bottom{ bottom:clamp(18px, 4.5vh, 44px); }

  h1{
    margin:0;
    font-family:var(--display);
    font-weight:800;
    font-size:clamp(29px, 7.6vw, 54px);
    line-height:1.02;
    letter-spacing:-.025em;
    text-wrap:balance;
    color:var(--win);
    transition:color .5s ease;
  }
  .sub{
    margin:12px auto 0;
    max-width:30ch;
    font-size:clamp(14px, 3.6vw, 17px);
    line-height:1.45;
    color:var(--bone-dim);
    text-wrap:balance;
  }
  .hint{
    margin:0;
    font-size:12.5px;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--bone-faint);
    transition:opacity .4s ease;
  }
  .fade-group{ transition:opacity .35s ease; }
  .is-hidden{ opacity:0; }

  /* ---------- convit del centre ---------- */
  .invite{
    position:absolute; left:50%; top:50%; z-index:1;
    width:var(--dot); height:var(--dot);
    margin-left:calc(var(--dot) / -2); margin-top:calc(var(--dot) / -2);
    border-radius:50%;
    border:2px dashed rgba(237,231,218,.22);
    animation:breathe 3.4s ease-in-out infinite;
    pointer-events:none;
  }
  /* Aturar l'animacio es l'unica manera d'amagar-lo: mentre s'executa,
     mana ella i no el que diguem des de l'estil en linia. */
  .invite.gone{ animation:none; opacity:0; }
  @keyframes breathe{
    0%,100%{ transform:scale(.9); opacity:.5 }
    50%    { transform:scale(1.04); opacity:1 }
  }

  /* ---------- cercles ---------- */
  .dots{ position:absolute; inset:0; z-index:2; }

  .dot{
    position:absolute; left:0; top:0;
    width:var(--dot); height:var(--dot);
    margin-left:calc(var(--dot) / -2);
    margin-top:calc(var(--dot) / -2);
    will-change:transform;
  }
  /* L'estat de repos es l'escala 1: aixi, quan l'animacio d'entrada acaba,
     les regles de guanyador i perdedor poden prendre el control. Amb
     "forwards" l'animacio es quedava enganxada i les anul·lava. */
  .body{
    position:absolute; inset:0;
    transform:scale(1);
    opacity:1;
    animation:pop .34s cubic-bezier(.2,1.5,.5,1);
    transition:transform .45s cubic-bezier(.2,.8,.3,1), opacity .45s ease;
  }
  @keyframes pop{ from{ transform:scale(.55); opacity:0 } }

  .halo{
    position:absolute; inset:-26%;
    border-radius:50%;
    background:radial-gradient(circle, var(--c) 0%, transparent 62%);
    opacity:.2;
    filter:blur(9px);
    transition:opacity .3s ease;
  }
  .core{
    position:absolute; inset:25%;
    border-radius:50%;
    background:var(--c);
    opacity:.2;
    box-shadow:inset 0 0 0 1.5px var(--c);
    transition:opacity .22s ease, transform .22s ease;
  }
  .ring{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .ring .track{ fill:none; stroke:rgba(237,231,218,.16); stroke-width:4; }
  .ring .prog{
    fill:none; stroke:var(--c); stroke-width:6; stroke-linecap:round;
    stroke-dasharray:326.73; stroke-dashoffset:326.73;
  }
  .pulse{
    position:absolute; inset:0;
    border-radius:50%;
    border:2px solid var(--c);
    opacity:0;
  }

  /* ritme del sorteig */
  .dot.flash .core{ opacity:1; transform:scale(1.1); }
  .dot.flash .halo{ opacity:.85; }

  /* perdedors */
  .dot.out .body{ transform:scale(.72); opacity:.14; }
  .dot.out .prog{ stroke-dashoffset:326.73; transition:stroke-dashoffset .5s ease; }

  /* guanyador */
  .dot.win .body{ transform:scale(1.2); }
  .dot.win .core{ opacity:1; }
  .dot.win .halo{ opacity:.95; inset:-55%; }
  .dot.win .ring .track{ stroke:transparent; }
  .dot.win .pulse{ animation:ripple 2.1s cubic-bezier(.15,.6,.3,1) infinite; }
  @keyframes ripple{
    0%  { transform:scale(1);   opacity:.55 }
    80% { transform:scale(2.5); opacity:0 }
    100%{ transform:scale(2.5); opacity:0 }
  }

  @media (prefers-reduced-motion: reduce){
    .invite{ animation:none; }
    .dot.win .pulse{ animation:none; opacity:.3; }
    .body{ animation:none; }
  }
</style>

<div class="stage" id="stage">
  <div class="invite" id="invite"></div>
  <div class="dots" id="dots"></div>

  <header class="hud hud-top">
    <div id="status" role="status" aria-live="polite">
      <h1 id="title">Qui comença?</h1>
      <p class="sub" id="sub">Cada jugador posa un dit a la pantalla i el manté.</p>
    </div>
  </header>

  <footer class="hud hud-bottom">
    <p class="hint" id="hint">Sorteig aleatori · mínim 2 jugadors</p>
  </footer>
</div>

<script>
(function(){
  'use strict';

  // --- configuració ------------------------------------------------------
  var PALETTE = ['#FF5A4E','#FF9F2E','#FFD84D','#A3E635','#2FD9A0',
                 '#28C2E8','#5B8CFF','#A978FF','#FF6FB5','#E8E2D6'];
  var MIN_PLAYERS = 2;
  var ARM_MS = 2600;          // temps que cal mantenir els dits quiets
  var CIRCUMFERENCE = 326.73; // 2·π·52, el radi de l'anell SVG

  var stage  = document.getElementById('stage');
  var dotsEl = document.getElementById('dots');
  var invite = document.getElementById('invite');
  var titleEl= document.getElementById('title');
  var subEl  = document.getElementById('sub');
  var hintEl = document.getElementById('hint');
  var root   = document.documentElement;

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var finePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  var IDLE_HINT = finePointer
    ? 'Amb ratolí: clica per posar un cercle, torna-hi per treure’l'
    : 'Sorteig aleatori · mínim 2 jugadors';
  hintEl.textContent = IDLE_HINT;

  // --- estat -------------------------------------------------------------
  var state = 'idle';            // idle | arming | picking | result
  var players = new Map();       // id -> {x, y, el, prog, sticky}
  var armStart = 0;
  var rafId = 0;
  var mouseSeq = 0;
  var dragId = null;
  var timers = [];

  function later(fn, ms){ var t = setTimeout(fn, ms); timers.push(t); return t; }
  function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

  function dotRadius(){
    var v = parseFloat(getComputedStyle(root).getPropertyValue('--dot'));
    return (isFinite(v) ? v : 120) / 2;
  }

  function buzz(pattern){
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch(e){}
  }

  // Sorteig sense biaix: descarta els valors que no reparteixen igual.
  function fairIndex(n){
    try {
      if (window.crypto && window.crypto.getRandomValues){
        var limit = Math.floor(4294967296 / n) * n;
        var buf = new Uint32Array(1), v;
        do { window.crypto.getRandomValues(buf); v = buf[0]; } while (v >= limit);
        return v % n;
      }
    } catch(e){}
    return Math.floor(Math.random() * n);
  }

  // --- cercles -----------------------------------------------------------
  function createDot(color){
    var el = document.createElement('div');
    el.className = 'dot';
    el.style.setProperty('--c', color);
    el.innerHTML =
      '<div class="body">' +
        '<div class="halo"></div>' +
        '<div class="pulse"></div>' +
        '<svg class="ring" viewBox="0 0 120 120" aria-hidden="true">' +
          '<circle class="track" cx="60" cy="60" r="52"></circle>' +
          '<circle class="prog" cx="60" cy="60" r="52" transform="rotate(-90 60 60)"></circle>' +
        '</svg>' +
        '<div class="core"></div>' +
      '</div>';
    dotsEl.appendChild(el);
    return el;
  }

  function place(p){
    p.el.style.transform = 'translate3d(' + p.x + 'px,' + p.y + 'px,0)';
  }

  function setProgress(p, frac){
    p.prog.style.strokeDashoffset = String(CIRCUMFERENCE * (1 - frac));
  }

  function addPlayer(id, x, y, sticky){
    var color = PALETTE[players.size % PALETTE.length];
    var el = createDot(color);
    var p = { x:x, y:y, el:el, prog:el.querySelector('.prog'), sticky:!!sticky, color:color };
    place(p);
    players.set(id, p);
    buzz(8);
    return p;
  }

  function removePlayer(id){
    var p = players.get(id);
    if (!p) return;
    p.el.remove();
    players.delete(id);
  }

  function hitTest(x, y){
    var r = dotRadius();
    var found = null;
    players.forEach(function(p, id){
      var dx = p.x - x, dy = p.y - y;
      if (dx*dx + dy*dy <= r*r) found = id;
    });
    return found;
  }

  // --- textos ------------------------------------------------------------
  function say(title, sub, hint){
    titleEl.textContent = title;
    subEl.textContent = sub || '';
    subEl.classList.toggle('is-hidden', !sub);
    hintEl.textContent = hint === undefined ? IDLE_HINT : hint;
    hintEl.classList.toggle('is-hidden', hint === '');
  }

  function refreshIdleText(){
    var n = players.size;
    if (n === 0)      say('Qui comença?', 'Cada jugador posa un dit a la pantalla i el manté.');
    else if (n < MIN_PLAYERS) say('Encara falta algú', 'Cal com a mínim dos dits a la pantalla.');
    else              say(n + ' jugadors', 'No aixequeu el dit.', 'Mantingueu-vos quiets');
  }

  // --- compte enrere -----------------------------------------------------
  function syncArming(){
    if (state === 'picking' || state === 'result') return;

    invite.classList.toggle('gone', players.size > 0);

    if (players.size >= MIN_PLAYERS){
      if (state !== 'arming'){ state = 'arming'; }
      armStart = performance.now();          // qualsevol canvi reinicia el compte
      if (!rafId) rafId = requestAnimationFrame(tick);
    } else {
      state = 'idle';
      cancelAnimationFrame(rafId); rafId = 0;
      players.forEach(function(p){ setProgress(p, 0); });
    }
    refreshIdleText();
  }

  function tick(now){
    if (state !== 'arming'){ rafId = 0; return; }
    var frac = Math.min(1, (now - armStart) / ARM_MS);
    players.forEach(function(p){ setProgress(p, frac); });
    if (frac >= 1){ rafId = 0; startDraw(); return; }
    rafId = requestAnimationFrame(tick);
  }

  // --- sorteig -----------------------------------------------------------
  function clearFlash(){
    players.forEach(function(p){ p.el.classList.remove('flash'); });
  }

  function startDraw(){
    state = 'picking';
    cancelAnimationFrame(rafId); rafId = 0;

    var ids = Array.from(players.keys());
    var n = ids.length;
    var winner = fairIndex(n);

    say('Sortejant…', '', '');
    buzz(18);

    if (reduced){
      later(function(){ declare(ids[winner]); }, 500);
      return;
    }

    var loops = n <= 3 ? 4 : 3;
    var total = loops * n + winner;   // l'última passa cau sobre el guanyador
    var i = 0;

    (function step(){
      clearFlash();
      var cur = i % n;
      var p = players.get(ids[cur]);
      if (p) p.el.classList.add('flash');
      buzz(9);

      if (i === total){
        later(function(){ declare(ids[cur]); }, 280);
        return;
      }
      var t = total ? i / total : 1;
      i++;
      later(step, 52 + 340 * Math.pow(t, 2.6));
    })();
  }

  function declare(id){
    state = 'result';
    clearFlash();
    var win = players.get(id);
    players.forEach(function(p, pid){
      if (pid === id){ p.el.classList.add('win'); setProgress(p, 1); }
      else { p.el.classList.add('out'); }
    });
    if (win) root.style.setProperty('--win', win.color);
    buzz([0, 26, 70, 26, 70, 90]);
    say('Comences tu', 'Toca la pantalla per tornar a sortejar.', '');
  }

  // --- reinici -----------------------------------------------------------
  function reset(){
    clearTimers();
    cancelAnimationFrame(rafId); rafId = 0;
    players.forEach(function(p){ p.el.remove(); });
    players.clear();
    dragId = null;
    state = 'idle';
    root.style.setProperty('--win', 'var(--bone)');
    invite.classList.remove('gone');
    refreshIdleText();
    hintEl.textContent = IDLE_HINT;
    hintEl.classList.remove('is-hidden');
  }

  // --- entrada -----------------------------------------------------------
  function coords(e){
    var r = stage.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  stage.addEventListener('pointerdown', function(e){
    e.preventDefault();

    if (state === 'picking') return;
    if (state === 'result'){ reset(); }

    var c = coords(e);

    if (e.pointerType === 'mouse'){
      var hit = hitTest(c.x, c.y);
      if (hit !== null){ removePlayer(hit); syncArming(); return; }
      var id = 'm' + (++mouseSeq);
      addPlayer(id, c.x, c.y, true);
      dragId = id;
    } else {
      addPlayer(e.pointerId, c.x, c.y, false);
    }
    syncArming();
  }, { passive:false });

  stage.addEventListener('pointermove', function(e){
    if (state === 'picking' || state === 'result') return;
    var id = (e.pointerType === 'mouse') ? dragId : e.pointerId;
    if (id === null || !players.has(id)) return;
    e.preventDefault();
    var p = players.get(id);
    var c = coords(e);
    p.x = c.x; p.y = c.y;
    place(p);
  }, { passive:false });

  function lift(e){
    if (e.pointerType === 'mouse'){ dragId = null; return; }   // amb ratolí els cercles es queden
    if (state === 'picking' || state === 'result') return;
    if (!players.has(e.pointerId)) return;
    removePlayer(e.pointerId);
    syncArming();
  }
  stage.addEventListener('pointerup', lift);
  stage.addEventListener('pointercancel', lift);

  window.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  // --- mantenir la pantalla encesa ---------------------------------------
  var lock = null;
  function keepAwake(){
    try {
      navigator.wakeLock.request('screen').then(function(l){ lock = l; }, function(){});
    } catch(e){}
  }
  keepAwake();
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible' && !lock) keepAwake();
  });

  refreshIdleText();
})();
</script>

<script>
/* El manifest es genera aqui mateix, com a blob del mateix origen, perque
   l'aplicacio segueixi sent un unic fitxer sense dependencies externes. */
(function () {
  'use strict';
  try {
    var icon180 = document.querySelector('link[rel="apple-touch-icon"]').href;
    var icon512 = document.querySelector('link[rel="icon"]').href;
    var manifest = {
      name: 'Qui comença?',
      short_name: 'Qui comença?',
      description: 'Cada jugador posa un dit a la pantalla i un sorteig decideix qui comença.',
      lang: 'ca',
      start_url: location.pathname,
      scope: location.pathname.replace(/[^/]*$/, ''),
      display: 'standalone',
      orientation: 'portrait',
      background_color: '#0A1416',
      theme_color: '#0A1416',
      icons: [
        { src: icon180, sizes: '180x180', type: 'image/png', purpose: 'any' },
        { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any' },
        { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
      ]
    };
    var blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    var link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  } catch (e) { /* sense manifest, la icona segueix sortint per apple-touch-icon */ }
})();
</script>
</body>
</html>
